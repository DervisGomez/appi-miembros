services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: churchapi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "ChurchApi_Docker123!"
      MSSQL_SA_PASSWORD: "ChurchApi_Docker123!"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - churchapi-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  churchapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churchapi-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ChurchDB;User Id=sa;Password=ChurchApi_Docker123!;TrustServerCertificate=True;"
      Database__ApplyMigrations: "true"
      Jwt__Secret: "ChurchApi-Docker-Secret-Key-Minimum32Chars!"
      Jwt__Issuer: "ChurchApi"
      Jwt__Audience: "ChurchApi.Clients"
      Jwt__ExpirationMinutes: "60"
    ports:
      - "8080:8080"
    networks:
      - churchapi-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:

networks:
  churchapi-network:
    driver: bridge
